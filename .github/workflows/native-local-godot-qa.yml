name: Native Godot engine for validating owner's GLB integration
on:
  push:
    branches:
      - development/two-storey-playable
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve official Godot 4.4.1 Linux binary
        run: |
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o engine.zip
          unzip -o engine.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          ./Godot_v4.4.1-stable_linux.x86_64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: official-godot-4-4-1-binary
          path: Godot_v4.4.1-stable_linux.x86_64
          retention-days: 1

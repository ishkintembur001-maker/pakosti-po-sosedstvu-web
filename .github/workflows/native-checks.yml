name: Verify native Godot game
on:
  push:
    branches: [main]
    paths: ['source/**', 'ci/**', '.github/workflows/native-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.3.2 and Godot 4.4.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxi6 libxrender1 libxxf86vm1 libxfixes3 libgl1 python3-pil
          mkdir -p tools evidence
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o tools/blender.tar.xz
          tar -xf tools/blender.tar.xz -C tools
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o tools/godot.zip
          unzip -q tools/godot.zip -d tools
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o tools/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          chmod +x tools/Godot_v4.4.1-stable_linux.x86_64
      - name: Rebuild textures and Blender models from source
        run: |
          python3 source/art/make_textures.py
          tools/blender-4.3.2-linux-x64/blender --background --factory-startup --python source/art/build_assets.py > evidence/blender-build.log 2>&1
          test -s source/art/apartment_cast.blend
          test -s source/assets/models/apartment_cast.glb
      - name: Import and verify all four episodes and mobile controls
        run: |
          tools/Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --path source --editor --import --quit > evidence/import.log 2>&1
          tools/Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --path source --script res://tests/episode_smoke.gd > evidence/gameplay-tests.log 2>&1
          tools/Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --path source --script res://tests/mobile_qa.gd > evidence/mobile-tests.log 2>&1
          grep -q EPISODE_3D_GAMEPLAY_OK evidence/gameplay-tests.log
          grep -q MOBILE_MULTITOUCH_OK evidence/mobile-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|TEST_FAILED' evidence/*.log; then exit 1; fi
      - name: Capture real Godot frames and measure renderer
        env:
          PAKOSTI_QA_DIR: ${{ github.workspace }}/evidence
        run: |
          xvfb-run -a tools/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --path source --rendering-method gl_compatibility --script res://tests/visual_qa.gd > evidence/visual-qa.log 2>&1
          xvfb-run -a tools/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --path source --rendering-method gl_compatibility --script res://tests/performance_qa.gd > evidence/performance-qa.log 2>&1
          test -s evidence/gameplay.png
          test -s evidence/cast.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-qa-screenshots-and-logs
          path: evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: editable-blender-models
          path: |
            source/art/apartment_cast.blend
            source/assets/models/apartment_cast.glb

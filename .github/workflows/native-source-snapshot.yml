name: Native Godot source snapshot for owner-model integration
on:
  push:
    branches:
      - development/two-storey-playable
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export editable Godot source (no generated binaries)
        uses: actions/upload-artifact@v4
        with:
          name: native-godot-source-for-owner-models
          path: |
            source/
            README.md
          if-no-files-found: error
          retention-days: 2

name: Verify native mobile game
on:
  push:
    branches: [development/two-storey-playable]
  pull_request:
    paths: ['source/**', '.github/workflows/house-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxi6 libxrender1 libxxf86vm1 libxfixes3 libgl1 python3-pil
          mkdir -p tools evidence native-dist
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o tools/blender.tar.xz
          tar -xf tools/blender.tar.xz -C tools
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o tools/godot.zip
          unzip -q tools/godot.zip -d tools
          chmod +x tools/Godot_v4.4.1-stable_linux.x86_64
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o tools/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -oj tools/templates.tpz templates/android_debug.apk templates/android_release.apk -d ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Build original and new Blender assets
        run: |
          python3 source/art/make_textures.py
          tools/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python source/art/build_assets.py > evidence/classic-blender.log 2>&1
          tools/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python source/art/refine_cast.py > evidence/house-blender.log 2>&1
          tools/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python source/art/replace_faces.py > evidence/face-blender.log 2>&1
          tools/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python source/art/tailor_cast.py > evidence/tailor-cast.log 2>&1
          tools/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python source/art/sculpt_cast.py > evidence/sculpt-cast.log 2>&1
          tools/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python source/art/sculpt_proportions.py > evidence/sculpt-proportions.log 2>&1
          tools/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python source/art/facial_details.py > evidence/facial-details.log 2>&1
          tools/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python source/art/polish_environments.py > evidence/environment-blender.log 2>&1
          tools/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python source/art/character_microdetail.py > evidence/character-microdetail.log 2>&1
          python3 source/tests/character_pbr_check.py
      - name: Verify gameplay and animations
        run: |
          tools/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path source --import --quit > evidence/import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|TEST_FAILED' evidence/import.log; then
            echo "Godot script import failed"; exit 1
          fi
          for test in episode_smoke mobile_qa house_qa animation_qa mobile_layout_qa cast_quality_qa environment_qa visual_integrity_qa owner_models_qa; do
            timeout --signal=TERM --kill-after=10s 180s tools/Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --path source --script res://tests/$test.gd > evidence/$test.log 2>&1 || {
              echo "Godot test failed or timed out: $test"; tail -n 60 evidence/$test.log; exit 1;
            }
            if grep -E 'SCRIPT ERROR|Parse Error|TEST_FAILED' evidence/$test.log; then
              echo "Godot test script error: $test"; exit 1
            fi
          done
      - name: Capture native game and mobile UI frames
        run: |
          xvfb-run -a tools/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --path source --script res://tests/house_capture.gd > evidence/capture.log 2>&1
          xvfb-run -a tools/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --path source --script res://tests/house_pose_capture.gd > evidence/poses.log 2>&1
          xvfb-run -a tools/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --path source --script res://tests/facial_capture.gd > evidence/facial-poses.log 2>&1
          xvfb-run -a tools/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --path source --script res://tests/environment_capture.gd > evidence/environment-capture.log 2>&1
          xvfb-run -a tools/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --path source --script res://tests/house_performance.gd > evidence/performance.log 2>&1
          xvfb-run -a tools/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --path source --script res://tests/mobile_capture.gd > evidence/mobile-capture.log 2>&1
      - name: Configure Android SDK and debug signing
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          test -x "${ANDROID_SDK_ROOT}/platform-tools/adb"
          test -d "${JAVA_HOME_17_X64}"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
          test -x "${ANDROID_SDK_ROOT}/platform-tools/adb"
          keytool -genkeypair -noprompt -keystore "${RUNNER_TEMP}/pakosti-debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${RUNNER_TEMP}/pakosti-debug.keystore" >> "${GITHUB_ENV}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "${GITHUB_ENV}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "${GITHUB_ENV}"
          tools/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path source --script res://tests/configure_android_export.gd > evidence/android-setup.log 2>&1
      - name: Export native Android ARM64 debug APK
        run: |
          tools/Godot_v4.4.1-stable_linux.x86_64 --headless --path source --export-debug Android ../native-dist/Pakosti-debug.apk > evidence/android-export.log 2>&1
          test -s native-dist/Pakosti-debug.apk
          unzip -t native-dist/Pakosti-debug.apk | tail -1
          python3 -c 'import zipfile; f=zipfile.ZipFile("native-dist/Pakosti-debug.apk"); assert "AndroidManifest.xml" in f.namelist(); assert any("arm64-v8a" in n for n in f.namelist()); print("NATIVE_ANDROID_APK_OK",len(f.namelist()))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mobile-evidence
          path: |
            evidence/
            mobile-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: pakosti-android-debug-apk
          path: native-dist/Pakosti-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: native-editable-blender-model
          path: |
            source/art/two_storey_faces.blend
            source/art/House_lit.blend
            source/art/Apartment_lit.blend
